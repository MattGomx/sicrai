<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Máquinas | SICRAI</title>

    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/sidebar-toggle.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .filtros {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            border: 2px solid #e0e0e0;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-family: "Poppins", sans-serif;
            cursor: pointer;
            transition: .2s;
            color: #555;
        }

        .filtro-btn:hover {
            border-color: #249341;
        }

        .filtro-btn.active {
            background: linear-gradient(135deg, #249341, #48a840);
            border-color: transparent;
            color: white;
        }

        .maquinas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .maquina-card {
            background: white;
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            border-left: 6px solid #ccc;
        }

        .maquina-card.cheia {
            border-left-color: #e53935;
        }

        .maquina-card.vazia {
            border-left-color: #249341;
        }

        .maquina-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .maquina-topo h3 {
            margin-bottom: 4px;
        }

        .maquina-topo p {
            color: #888;
            font-size: .85rem;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: .78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge.cheia {
            background: #fdeaea;
            color: #e53935;
        }

        .badge.vazia {
            background: #e8f7ec;
            color: #249341;
        }

        .nivel-bar {
            width: 100%;
            height: 10px;
            border-radius: 20px;
            background: #eee;
            overflow: hidden;
            margin: 14px 0 6px;
        }

        .nivel-fill {
            height: 100%;
            border-radius: 20px;
            transition: width .6s ease;
        }

        .nivel-texto {
            font-size: .82rem;
            color: #888;
            margin-bottom: 16px;
        }

        .maquina-card button {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #249341, #48a840);
        }

        .maquina-card button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .vazio-aviso {
            grid-column: 1/-1;
            text-align: center;
            color: #888;
            padding: 40px;
        }

        body.dark .maquina-card {
            background: #1e1e1e;
            color: white;
        }

        body.dark .filtro-btn {
            background: #1e1e1e;
            color: #ccc;
            border-color: #333;
        }

        body.dark .maquina-topo p {
            color: #aaa;
        }
    </style>

</head>

<body>

    <script>
        if (localStorage.getItem("tema") === "dark") {
            document.body.classList.add("dark");
        }
    </script>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-recycle"></i>
            <span>SICRAI</span>
        </div>

        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Minimizar menu">
            <i class="fa-solid fa-angles-left"></i>
        </button>

        <nav>

            <a href="mapa.html">
                <i class="fa-solid fa-map-location-dot"></i>
                <span class="link-text">Mapa</span>
            </a>

            <a href="dashboard.html">
                <i class="fa-solid fa-chart-line"></i>
                <span class="link-text">Dashboard</span>
            </a>

            <a href="reciclagens.html">
                <i class="fa-solid fa-recycle"></i>
                <span class="link-text">Reciclagens</span>
            </a>

            <a href="recompensas-dashboard.html">
                <i class="fa-solid fa-gift"></i>
                <span class="link-text">Recompensas</span>
            </a>

            <a href="ranking.html">
                <i class="fa-solid fa-trophy"></i>
                <span class="link-text">Ranking</span>
            </a>

            <a href="configuracoes.html">
                <i class="fa-solid fa-gear"></i>
                <span class="link-text">Configurações</span>
            </a>

            <a href="maquinas.html" class="active">
                <i class="fa-solid fa-industry"></i>
                <span class="link-text">Máquinas</span>
            </a>



            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="link-text">Sair</span>
            </a>

        </nav>

    </aside>

    <!-- CONTEÚDO -->

    <main class="main">

        <div class="topbar">
            <div>
                <h1>🏭 Máquinas de Coleta</h1>
                <p>Veja quais coletores estão cheios e precisam de atenção.</p>
            </div>
        </div>

        <div class="filtros">
            <button class="filtro-btn active" data-filtro="todas">Todas</button>
            <button class="filtro-btn" data-filtro="cheia">Cheias</button>
            <button class="filtro-btn" data-filtro="vazia">Vazias</button>
        </div>

        <div class="maquinas-grid" id="maquinasGrid">
            <p class="vazio-aviso">Carregando máquinas...</p>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/role-guard.js"></script>

    <script>

        let todasMaquinas = [];
        let filtroAtual = "todas";

        async function iniciar() {
            const acesso = await protegerPagina(["catador", "admin"]);
            if (!acesso) return;

            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await client.auth.signOut();
                window.location.href = "login.html";
            });

            await carregarMaquinas();
        }

        async function carregarMaquinas() {
            const { data, error } = await client
                .from("maquinas")
                .select("id, nome, localizacao, status, nivel")
                .order("nome", { ascending: true });

            if (error || !data) {
                document.getElementById("maquinasGrid").innerHTML =
                    `<p class="vazio-aviso">Não foi possível carregar as máquinas.</p>`;
                return;
            }

            todasMaquinas = data;
            renderizarMaquinas();
        }

        function renderizarMaquinas() {
            const grid = document.getElementById("maquinasGrid");

            const lista = todasMaquinas.filter(m =>
                filtroAtual === "todas" ? true : m.status === filtroAtual
            );

            if (lista.length === 0) {
                grid.innerHTML = `<p class="vazio-aviso">Nenhuma máquina encontrada para este filtro.</p>`;
                return;
            }

            grid.innerHTML = lista.map(m => {
                const cheia = m.status === "cheia";
                const cor = cheia ? "#e53935" : "#249341";
                return `
                <div class="maquina-card ${m.status}">

                    <div class="maquina-topo">
                        <div>
                            <h3>${m.nome}</h3>
                            <p><i class="fa-solid fa-location-dot"></i> ${m.localizacao || "Local não informado"}</p>
                        </div>
                        <span class="badge ${m.status}">${cheia ? "Cheia" : "Vazia"}</span>
                    </div>

                    <div class="nivel-bar">
                        <div class="nivel-fill" style="width:${m.nivel}%; background:${cor};"></div>
                    </div>
                    <p class="nivel-texto">${m.nivel}% de capacidade</p>

                    <button data-id="${m.id}" ${cheia ? "" : "disabled"}>
                        ${cheia ? "Marcar como esvaziada" : "Já esvaziada"}
                    </button>

                </div>
                `;
            }).join("");
        }

        document.querySelectorAll(".filtro-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filtroAtual = btn.dataset.filtro;
                renderizarMaquinas();
            });
        });

        document.getElementById("maquinasGrid").addEventListener("click", async (e) => {
            const btn = e.target.closest("button[data-id]");
            if (!btn || btn.disabled) return;

            const id = btn.dataset.id;
            btn.disabled = true;
            btn.textContent = "Salvando...";

            const { error } = await client
                .from("maquinas")
                .update({ status: "vazia", nivel: 0, updated_at: new Date().toISOString() })
                .eq("id", id);

            if (error) {
                alert("Erro ao atualizar a máquina. Tente novamente.");
            }

            await carregarMaquinas();
        });

        iniciar();

    </script>

    <script src="assets/js/sidebar-role.js"></script>
    <script src="assets/js/sidebar-toggle.js"></script>

</body>

</html>
