<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | SICRAI</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/toast.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <i class="fa-solid fa-recycle"></i>
                <h2>SICRAI</h2>
            </div>

            <h1>Criar Conta</h1>

            <p>Cadastre-se e comece a ganhar recompensas.</p>

            <form id="cadastroForm">

                <div class="input-group">
                    <label>Nome Completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Confirme sua senha"
                        required>
                </div>

                <button type="submit" class="btn-primary auth-btn">
                    Criar Conta
                </button>

            </form>

            <div class="auth-links">
                <a href="login.html">Já possuo conta</a>
            </div>

            <div class="back-home">
                <a href="index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar ao início
                </a>
            </div>

        </div>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/toast.js"></script>

    <script>

        document
            .getElementById("cadastroForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const nome = document.getElementById("nome").value;
                const email = document.getElementById("email").value;
                const senha = document.getElementById("senha").value;
                const confirmar = document.getElementById("confirmarSenha").value;

                if (senha.length < 6) {
                    mostrarToast("A senha deve possuir pelo menos 6 caracteres.", "aviso");
                    return;
                }

                if (senha !== confirmar) {
                    mostrarToast("As senhas não coincidem.", "aviso");
                    return;
                }

                const { data, error } = await client.auth.signUp({
                    email,
                    password: senha,
                    options: {
                        data: { nome }
                    }
                });

                if (error) {
                    mostrarToast(error.message, "erro");
                    return;
                }

                mostrarToast("Cadastro realizado com sucesso!", "sucesso");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            });

    </script>

</body>

</html>
